name: patch-selftest

# Exercises IPAPatch against a real archive on a macOS runner: builds a small
# arm64 .ipa, applies a rename plus a tweak injection through the same code the
# app uses, then checks the result with the system's own tools (unzip, plutil,
# otool). The app's build only proves the code compiles; this proves it rewrites
# an archive correctly.

on:
  push:
    paths:
      - "ios-app/IPAPatch.swift"
      - "ios-app/AppConfig.swift"
      - "tools/patch-selftest/**"
      - ".github/workflows/patch-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Patch a sample .ipa
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the harness
        run: |
          swiftc -O ios-app/IPAPatch.swift ios-app/AppConfig.swift tools/patch-selftest/main.swift \
            -o "$RUNNER_TEMP/patch-selftest"

      - name: Build a sample .ipa and a tweak
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          WORK="$RUNNER_TEMP/sample"
          APP="$WORK/root/Payload/Test.app"
          mkdir -p "$APP/PlugIns/Widget.appex" "$APP/Watch/WatchApp.app" "$WORK/root/Payload/Test.app/Frameworks"

          cat > "$WORK/main.c" <<'C'
          int main(void) { return 0; }
          C
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.4.0 -isysroot "$SDK" \
            -o "$APP/Test" "$WORK/main.c"
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.4.0 -isysroot "$SDK" \
            -dynamiclib -o "$WORK/TestTweak.dylib" "$WORK/main.c"

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Test</string>
            <key>CFBundleIdentifier</key><string>com.example.test</string>
            <key>CFBundleName</key><string>Test</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>17.4</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
          </dict></plist>
          PLIST

          sed 's#com.example.test#com.example.test.widget#' "$APP/Info.plist" \
            > "$APP/PlugIns/Widget.appex/Info.plist"
          sed 's#com.example.test#com.example.test.watchapp#' "$APP/Info.plist" \
            > "$APP/Watch/WatchApp.app/Info.plist"
          mkdir -p "$APP/Watch/WatchApp.app/Watch"
          echo "a resource that must survive patching" > "$APP/Resource.txt"

          cd "$WORK/root"
          zip -qry "$WORK/Test.ipa" Payload
          cp "$WORK/Test.ipa" "$WORK/Original.ipa"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Apply the configuration
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/patch-selftest" "$WORK/Test.ipa" "$WORK/TestTweak.dylib"

      - name: Check the rebuilt archive
        run: |
          set -euo pipefail
          cd "$WORK"
          echo "::group::zip integrity"
          unzip -tq Test.ipa
          echo "::endgroup::"

          echo "::group::contents"
          unzip -l Test.ipa
          echo "::endgroup::"

          rm -rf out && mkdir out && unzip -q Test.ipa -d out
          APP="out/Payload/Test.app"

          echo "::group::Info.plist"
          plutil -p "$APP/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "com.example.renamed"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = "Renamed App"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "9.9"
          test "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")" = "42"
          echo "::endgroup::"

          echo "::group::extension renamed, watch app removed"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/PlugIns/Widget.appex/Info.plist")" = "com.example.renamed.Widget"
          test ! -d "$APP/Watch/WatchApp.app"
          echo "::endgroup::"

          echo "::group::tweak"
          test -f "$APP/Frameworks/TestTweak.dylib"
          otool -l "$APP/Test" | grep -A2 LC_LOAD_DYLIB
          otool -l "$APP/Test" | grep -q "@executable_path/Frameworks/TestTweak.dylib"
          # The header still has to describe exactly the commands that follow.
          otool -h "$APP/Test"
          echo "::endgroup::"

          echo "::group::untouched members are byte-identical"
          # A resource the configuration doesn't mention has to come through
          # exactly, compressed bytes and all.
          unzip -p Original.ipa Payload/Test.app/Resource.txt > /tmp/before.txt
          unzip -p Test.ipa Payload/Test.app/Resource.txt > /tmp/after.txt
          cmp /tmp/before.txt /tmp/after.txt
          echo "Resource.txt identical"
          echo "::endgroup::"
