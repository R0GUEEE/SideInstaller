name: source-parser

# Decodes real source documents through the app's own models and fails if any
# app is dropped or left without a release. "Empty when filtered" was exactly
# this: a v1 document whose entries the typed decoder threw away.
#
# Runs the Swift toolchain on Ubuntu: these models are plain Foundation, so
# they need no Xcode and no macOS queue.

on:
  push:
    paths:
      - "ios-app/AltSource.swift"
      - "tools/parser-check/**"
      - ".github/workflows/source-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Decode live sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v7

      - name: Build the checker
        run: |
          swiftc -O ios-app/AltSource.swift ios-app/SourceKind.swift tools/parser-check/main.swift \
            -o /tmp/parser-check

      - name: Decode real sources
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl)
          install -d "$RUNNER_TEMP/src"
          # Fetch and validate before parsing: an empty body would look like a
          # source with no apps, which is the bug this check exists to catch.
          fetch() {
            name="$1"; url="$2"
            for attempt in 1 2 3; do
              curl -sL -m 60 --retry 2 -A "SideInstaller/source-parser" "$url" \
                -o "$RUNNER_TEMP/src/$name.json" && break
              sleep 5
            done
            python3 - "$RUNNER_TEMP/src/$name.json" "$url" <<'PY'
          import json, os, sys
          path, url = sys.argv[1], sys.argv[2]
          if not os.path.exists(path) or os.path.getsize(path) < 500:
              sys.exit("download too small: " + url)
          try:
              doc = json.load(open(path))
          except Exception as e:
              sys.exit("not JSON: %s (%s)" % (url, e))
          if not doc.get("apps"):
              sys.exit("no apps in document: " + url)
          print("%-28s %6d apps, %d bytes" % (url, len(doc["apps"]), os.path.getsize(path)))
          PY
          }
          fetch cypwn   https://ipa.cypwn.xyz/cypwn.json
          fetch apptesters https://repository.apptesters.org
          fetch altstore https://apps.altstore.io
          fetch quark   https://quarksources.github.io/altstore-complete.json
          chmod +x /tmp/parser-check
          ls -l /tmp/parser-check
          # The Swift runtime lives in the toolchain, which the container's
          # default library path doesn't always include.
          export LD_LIBRARY_PATH="/usr/lib/swift/linux:${LD_LIBRARY_PATH:-}"
          /tmp/parser-check "$RUNNER_TEMP"/src/*.json
